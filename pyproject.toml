[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poppy-assistant"
version = "1.0.0"
description = "Poppy — trợ lý AI lễ tân (chat + voice, RAG + function calling) đóng gói thành Django app cắm được vào project sẵn có."
requires-python = ">=3.12"
authors = [{ name = "Poppy" }]
readme = "README.md"

# Phụ thuộc LÕI (chat text + RAG). Cài là dùng được /api/chat.
dependencies = [
    "Django>=5.0,<6.1",
    "channels>=4.1.0",        # WebSocket (ASGI) — cần cho voice; app import routing
    "openai>=1.30.0",         # gọi Gemini qua API tương thích OpenAI
    "chromadb>=0.5.0",        # vector DB cho RAG (embedding local ONNX)
    "python-frontmatter>=1.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Gọi điện realtime online (trình duyệt) + qua số điện thoại thật.
voice = ["google-genai>=1.0.0", "daphne>=4.1.0"]
phone = ["google-genai>=1.0.0", "daphne>=4.1.0"]
# Tiện ích dev (đọc .env khi chạy demo trực tiếp).
dev = ["python-dotenv>=1.0.0"]

[tool.setuptools.packages.find]
include = ["poppy_assistant*"]

[tool.setuptools.package-data]
poppy_assistant = ["static/poppy/*"]
